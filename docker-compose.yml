services:
  evidence-api:
    build:
      context: .
      dockerfile: backend/Dockerfile.evidence
    environment:
      RCA_EVIDENCE_API_KEY: ${RCA_EVIDENCE_API_KEY:?Set RCA_EVIDENCE_API_KEY}
    ports:
      - "8088:8000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - evidence-runtime:/home/nonroot/runtime
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  evidence-runtime:
