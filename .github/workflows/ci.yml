name: CI

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:

jobs:
  evidence-and-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint evaluated surface
        run: make lint

      - name: Run full test suite
        run: python -m pytest -q --cov=backend/rca_evidence --cov-report=term-missing --cov-report=xml

      - name: Validate deterministic evidence
        run: python scripts/validate_evidence.py

      - name: Audit accepted dependencies and code
        run: |
          python -m pip_audit -r backend/requirements-evidence.txt --progress-spinner off
          python -m bandit -r backend/rca_evidence backend/evidence_app.py -q

      - name: Replay frozen confirmation claims
        run: python scripts/run_evidence_benchmark.py --stage replay

  container-smoke:
    runs-on: ubuntu-latest
    needs: evidence-and-tests
    steps:
      - uses: actions/checkout@v4

      - name: Build non-root evidence image
        run: docker build -f backend/Dockerfile.evidence -t project8-evidence:ci .

      - name: Start evidence API
        run: |
          docker run -d --name project8-evidence \
            -e RCA_EVIDENCE_API_KEY=ci-evidence-key \
            -p 8088:8000 \
            project8-evidence:ci

      - name: Wait for readiness
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8088/health > /tmp/health.json; then
              break
            fi
            sleep 2
          done
          python -c "import json; d=json.load(open('/tmp/health.json')); assert d['status']=='ready'; assert d['selected_policy_id']=='fusion_balanced_v1'; assert d['orchestrator']=='langgraph'; assert d['agent_node_count']==6"

      - name: Authenticated STDF smoke
        run: |
          curl --fail --silent \
            -H 'X-API-Key: ci-evidence-key' \
            -F 'file=@data/synthetic_rca_v1/cases/development/DEV_001.stdf;type=application/octet-stream' \
            http://127.0.0.1:8088/api/v1/evidence/analyze \
            > /tmp/result.json
          python -c "import json; d=json.load(open('/tmp/result.json')); assert d['status']=='completed'; assert d['policy_id']=='fusion_balanced_v1'; assert len(d['stage_traces'])==6"

      - name: Verify non-root runtime
        run: test "$(docker exec project8-evidence id -u)" = "65532"

      - name: Show logs on failure
        if: failure()
        run: docker logs project8-evidence

      - name: Stop container
        if: always()
        run: docker rm -f project8-evidence || true
