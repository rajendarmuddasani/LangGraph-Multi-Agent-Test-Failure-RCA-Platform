name: CI

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov ruff pydantic pydantic-settings scipy numpy

      - name: Lint
        run: ruff check backend/ tests/ --select E,W,F --ignore E501 || true

      - name: Run tests (no external services required)
        run: pytest tests/ -v --tb=short -x

      - name: Validate evidence
        run: |
          python -c "
          import json
          c = json.load(open('evidence/claims.json'))
          assert len(c['claims']) >= 4
          assert c['external_services']['openai'] == 'not_required_for_tests'
          print(f'OK: {len(c[\"claims\"])} claims validated')
          "
